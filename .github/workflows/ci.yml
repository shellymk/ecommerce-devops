name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Conferir arquivos versionados
        run: python tools/verificar_segredos.py
      - name: Instalar dependências com hashes
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Analisar código e formatação
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Validar build preliminar
        run: python -m build --wheel --no-isolation

  test:
    name: Testes e cobertura
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Instalar dependências com hashes
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Instalar aplicação
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Testes unitários e integração HTTP com cobertura
        run: >-
          python -m pytest -v --cov
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/html
          --junitxml=reports/junit.xml
      - name: Disponibilizar relatórios aprovados
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 7

  artifact:
    name: Artefato versionado
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Instalar dependências com hashes
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Gerar artefato final após aprovação dos testes
        run: python -m build --wheel --no-isolation
      - name: Conferir conteúdo e testar instalação do wheel
        run: python tools/validar_artefato.py
      - name: Disponibilizar pacote versionado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecommerce-${{ github.sha }}
          path: dist/ecommerce_devops_academico-*.whl
          if-no-files-found: error
          retention-days: 7
